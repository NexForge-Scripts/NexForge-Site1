<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — NexForge Scripts</title>
<meta property="og:title" content="404 — Page Non Trouvée — NexForge Scripts">
<meta property="og:description" content="La page que vous cherchez n'existe pas ou a été déplacée.">
<meta property="og:image" content="https://nexforgescripts.com/logo-yatay.png">
<meta property="og:url" content="https://nexforgescripts.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="NexForge Scripts">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="../logo.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  :root {
    --bg: #0a0a0f;
    --accent: #00f5d4;
    --purple: #7b2ff7;
    --text: #e8e6e3;
    --text-muted: #8a8a8a;
    --border: rgba(255,255,255,0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    line-height: 1.6;
  }
  .glow {
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(0,245,212,0.05) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .glow-2 {
    position: fixed;
    bottom: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(123,47,247,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .content { position: relative; z-index: 1; }
  .code {
    font-size: 96px;
    font-weight: 900;
    letter-spacing: -3px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
    margin-bottom: 12px;
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
  p { color: var(--text-muted); font-size: 14px; max-width: 400px; margin-bottom: 32px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    color: #060810;
    transition: all 0.25s;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,245,212,0.20);
  }

  /* ---- Nav + Lang Switcher ---- */
  .nav-404 {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    z-index: 2;
  }
  .nav-404 .logo img { display: block; height: 28px; width: auto; }
  .nav-404 .lang-switcher { display: flex; gap: 4px; }
  .nav-404 .lang-switcher a {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 6px;
    font-size: 11px; font-weight: 700; text-decoration: none; transition: all 0.2s;
  }
  .nav-404 .lang-switcher a.active {
    background: var(--accent); color: #060810;
  }
  .nav-404 .lang-switcher a:not(.active) {
    color: var(--text-muted); border: 1px solid var(--border);
  }
  .nav-404 .lang-switcher a:not(.active):hover {
    border-color: var(--accent); color: var(--accent);
  }
  @media (max-width: 768px) {
    .nav-404 { padding: 16px 20px; }
  }
  /* page transition */
  body { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="glow"></div>
<div class="glow-2"></div>
<nav class="nav-404">
  <div class="logo"><a href="index.html"><img src="../logo.png" alt="NexForge"></a></div>
  <div class="lang-switcher">
    <a href="/404.html">TR</a>
    <a href="/en/404.html">EN</a>
    <a href="/fr/404.html" class="active">FR</a>
  </div>
</nav>
<div class="content">
  <div class="code">404</div>
  <h1>Page Non Trouvée</h1>
  <p>La page que vous cherchez n'existe pas ou a été déplacée.</p>
  <a href="/" class="btn">← Retour à l'Accueil</a>
</div>

</footer>
</body>
</html>
